[package]
name = "pill-detect"
version = "0.1.0"
authors = ["Sonicka Jadeesh <317060254+sonickajadeesh@users.noreply.github.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
dioxus = { version = "0.7.10", features = ["router"] }
dioxus-html = "0.7.10"
gloo-storage = "0.4.0"
js-sys = "0.3.104"
pulldown-cmark = "0.13.4"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.1", features = ["v4", "js"] }
wasm-bindgen = "0.2.127"
web-sys = "0.3.104"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
